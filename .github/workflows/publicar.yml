# Publica o Afinado no GitHub Pages a cada push na main.
#
# Não há build: o app é HTML/JS/CSS estático. O que este workflow faz de
# verdade é três coisas —
#
#   1. carimba a versão no service-worker.js com o hash do commit, pra que
#      cada publicação vire um cache novo sozinho (o jeito antigo era lembrar
#      de subir um número na mão, e esquecer disso deixava o app preso numa
#      versão antiga sem ninguém perceber);
#   2. gera a lista de arquivos do precache a partir do que existe no
#      repositório — mesma história do item 1, um degrau acima: com o app
#      dividido em dezenas de módulos, manter essa lista à mão era garantir
#      que um dia faltaria um arquivo, e falta de arquivo ali só aparece
#      offline, no aparelho de quem já instalou;
#   3. deixa de fora o que não é do site;
#   4. empurra o resultado pro branch `gh-pages`, que é de onde o site é servido.
#
# E ANTES DE TUDO: A VERIFICAÇÃO
# A página verificacao/ roda num Chromium sem tela (ferramentas/verificar.mjs).
# Um teste falhando para a publicação aqui — antes, o detector podia quebrar e
# ir pro ar do mesmo jeito, porque a verificação só rodava quando alguém
# lembrava de abrir a página.
#
# POR QUE BRANCH, E NÃO `actions/deploy-pages`
# A via oficial via Actions (configure-pages + deploy-pages) ficou presa em
# `deployment_queued` até estourar o tempo, três vezes seguidas, enquanto a API
# `/repos/.../pages` insistia em devolver 404 — o site nunca chegou a ser
# provisionado (o repositório nasceu privado, e Pages privado exige plano pago).
# Publicar por branch usa outra máquina, bem mais antiga e estável, e não
# depende daquela API. O preço é um branch a mais no repositório.
#
# Do lado do GitHub, isso exige Settings → Pages → Source: "Deploy from a
# branch" → `gh-pages` → `/ (root)`.

name: publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Uma publicação por vez, e a mais nova ganha: se você empurrar dois commits
# seguidos, não faz sentido esperar o primeiro terminar pra publicar o segundo.
# (Com `cancel-in-progress: false`, um run travado bloqueava todos os
# seguintes — foi exatamente o que aconteceu aqui.)
concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # O Playwright mora só em ferramentas/, que nunca vai pro ar.
      - name: Preparar o navegador da verificação
        working-directory: ferramentas
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Verificação — sem ela não publica
        run: node ferramentas/verificar.mjs

      - name: Gerar a lista de arquivos do precache
        run: ./ferramentas/listar-arquivos.sh

      - name: Carimbar a versão no service worker
        run: |
          versao="${GITHUB_SHA::7}"
          sed -i "s/^const VERSAO = 'dev';/const VERSAO = '${versao}';/" service-worker.js
          grep -q "const VERSAO = '${versao}';" service-worker.js \
            || { echo "::error::não consegui carimbar a versão — o marcador em service-worker.js mudou?"; exit 1; }
          echo "publicando como $versao"

      # Se a lista gerada acima apontar pra um arquivo que não existe, o
      # service worker não instala e o app para de funcionar offline sem
      # avisar ninguém. Conferir aqui custa um segundo e pega isso antes de ir
      # pro ar.
      - name: Conferir que todo arquivo listado existe
        run: |
          faltando=0
          while read -r caminho; do
            [[ -z "$caminho" || "$caminho" == "./" ]] && continue
            if [[ ! -f "$caminho" ]]; then
              echo "::error::o precache lista $caminho, que não existe"
              faltando=1
            fi
          done < <(sed -n "/INICIO-LISTA/,/FIM-LISTA/p" service-worker.js \
                   | grep -o "'\./[^']*'" | tr -d "'")
          exit $faltando

      - name: Separar o que vai pro ar
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude 'ferramentas' \
            --exclude 'node_modules'
          # verificacao/ vai junto de propósito: é a página que roda o motor de
          # pitch contra tons sintetizados, e rodá-la no celular de verdade
          # (e não só no navegador do computador) é metade do teste
          # sem isto o GitHub Pages passa o site pelo Jekyll e some com
          # qualquer arquivo começado por underscore
          touch _site/.nojekyll

      - name: Empurrar pro branch gh-pages
        run: |
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          # `--force` porque gh-pages é descartável: ele não guarda histórico,
          # é só o retrato do site agora. O histórico de verdade mora na main.
          git push --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
          echo "no ar em https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
