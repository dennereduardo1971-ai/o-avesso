<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<meta name="description" content="Treinador de canto que ouve a sua voz e diz onde ela está — afinação, extensão e progresso, tudo no seu aparelho.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icone.svg" type="image/svg+xml">
<!-- o iPhone ignora ícone SVG na tela de início; sem este PNG ele usa um print da página -->
<link rel="apple-touch-icon" href="assets/icone-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Afinado">
<link rel="stylesheet" href="styles/estilo.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Afinado — treinador de canto</title>
</head>
<body>
<header class="topo">
  <a class="marca" href="#/">
    <h1>Afinado</h1>
    <p class="subtitulo">seu treinador de canto</p>
  </a>
</header>

<main id="tela" aria-live="polite">
  <noscript>
    <section class="painel">
      <h2>Precisa de JavaScript</h2>
      <p class="progresso-texto">O Afinado escuta o microfone e calcula a afinação no próprio aparelho — sem JavaScript não há o que fazer.</p>
    </section>
  </noscript>
</main>

<footer class="rodape">
  <p>Tudo roda no seu navegador — nenhum áudio sai do seu aparelho.</p>
</footer>

<script type="module" src="app.js"></script>
