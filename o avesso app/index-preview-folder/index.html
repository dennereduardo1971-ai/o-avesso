<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b68a4e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>O Avesso — Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

:root {
  --bg-deep: #14101a;
  --panel: #201a28;
  --parchment: #ede2d0;
  --parchment-card: #ece0c9;
  --parchment-dim: #cabfae;
  --thread-blue: #3f5f7f;
  --ink-red: #a5453f;
  --gold: #b68a4e;
  --gold-soft: #8f7148;
  --ink-dark: #2b2130;
  --seam: #5f4f52;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg-deep);
  color: var(--parchment);
  font-family: 'EB Garamond', serif;
}
#app { display: flex; flex-direction: column; height: 100%; }

/* Top header */
.hub-header { text-align: center; padding: 18px 16px 10px; position: relative; }
.hub-eyebrow { letter-spacing: 0.28em; font-size: 10px; text-transform: uppercase; color: var(--gold); margin: 0 0 4px; }
.hub-title { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 28px; margin: 0; }
.logout-btn {
  position: absolute; top: 18px; right: 16px;
  background: none; border: 1px solid rgba(182,138,78,0.4); color: var(--parchment-dim);
  font-size: 11px; padding: 5px 10px; border-radius: 4px; cursor: pointer;
}
.logout-btn:hover { border-color: var(--gold); color: var(--parchment); }

/* Login screen */
.login-screen {
  display: flex; align-items: center; justify-content: center;
  height: 100%; padding: 20px;
}
.login-card {
  max-width: 320px; width: 100%;
  background: var(--panel);
  border: 1px solid rgba(182,138,78,0.35);
  border-radius: 6px;
  padding: 28px 24px;
  text-align: center;
}
.login-title { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 26px; margin: 0 0 4px; }
.login-sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: var(--parchment-dim); margin: 0 0 20px; }
.login-card .field { text-align: left; margin-bottom: 14px; }
.login-error { color: var(--ink-red); font-size: 12px; margin: 8px 0 0; min-height: 16px; }

/* Tab nav */
.tab-nav {
  display: flex; overflow-x: auto; gap: 6px;
  padding: 8px 12px 12px;
  border-bottom: 1px solid rgba(182,138,78,0.25);
  flex-shrink: 0;
}
.tab-btn {
  flex-shrink: 0;
  background: rgba(237,226,208,0.05);
  border: 1px solid rgba(182,138,78,0.3);
  color: var(--parchment-dim);
  font-family: 'EB Garamond', serif;
  font-size: 12px;
  padding: 7px 12px;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
}
.tab-btn.active { background: var(--gold); color: var(--ink-dark); font-weight: 600; border-color: var(--gold); }

.tab-content { flex: 1; overflow-y: auto; padding: 18px 16px 40px; }
.tab-panel { display: none; max-width: 640px; margin: 0 auto; }
.tab-panel.active { display: block; }

.section-title { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 22px; margin: 0 0 4px; text-align: center; }
.section-sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: var(--parchment-dim); text-align: center; margin: 0 0 18px; }

.card {
  background: var(--panel);
  border: 1px solid rgba(182,138,78,0.3);
  border-radius: 6px;
  padding: 16px 16px 14px;
  margin-bottom: 14px;
  position: relative;
}
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--parchment-dim); }
.field input[type="text"], .field textarea {
  background: rgba(237,226,208,0.06);
  border: 1px solid rgba(182,138,78,0.35);
  border-radius: 3px;
  color: var(--parchment);
  font-family: 'EB Garamond', serif;
  font-size: 14px;
  padding: 7px 10px;
  width: 100%;
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
.field.small input { width: 70px; text-align: center; }
.row-2 { display: grid; grid-template-columns: 1fr auto; gap: 12px; }

.btn {
  background: var(--gold); color: var(--ink-dark); border: none; border-radius: 5px;
  font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 15px;
  padding: 9px 18px; cursor: pointer;
}
.btn:hover { background: #c69a5e; }
.btn.ghost { background: rgba(237,226,208,0.06); color: var(--parchment); border: 1px solid var(--gold-soft); font-family: 'EB Garamond', serif; font-weight: 400; font-size: 12px; padding: 7px 12px; }
.btn.ghost:hover { border-color: var(--gold); }
.btn.danger { border: 1px solid var(--ink-red); background: none; color: var(--parchment-dim); font-family: 'EB Garamond', serif; font-size: 11px; padding: 6px 10px; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.center { text-align: center; }

.remove-x { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--parchment-dim); cursor: pointer; font-size: 13px; }
.remove-x:hover { color: var(--ink-red); }

.attrs { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
.attr-card { border: 1px solid rgba(182,138,78,0.3); border-radius: 6px; padding: 10px; text-align: center; background: rgba(0,0,0,0.15); }
.attr-name { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 14px; margin: 2px 0; }
.attr-input { width: 44px; text-align: center; background: rgba(237,226,208,0.08); border: 1px solid var(--gold-soft); border-radius: 4px; color: var(--parchment); font-size: 18px; padding: 3px; }

.spools { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
.spool { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--gold-soft); cursor: pointer; display:flex;align-items:center;justify-content:center; background: rgba(237,226,208,0.05); }
.spool.filled { background: var(--thread-blue); border-color: var(--thread-blue); }

.kit-item { display: flex; align-items: center; gap: 8px; border: 1px solid rgba(182,138,78,0.25); border-radius: 5px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
.kit-item input { accent-color: var(--gold); }

.npc-name-display { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 22px; color: var(--ink-dark); margin: 0 0 10px; }
.npc-card { background: var(--parchment-card); color: var(--ink-dark); border-top: 5px solid var(--thread-blue); border-radius: 4px; padding: 16px 18px; margin-top: 12px; }
.npc-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(43,33,48,0.55); font-weight: 600; }
.npc-value { font-size: 14px; margin: 2px 0 10px; }

.board-scroll { border: 1px solid rgba(182,138,78,0.4); border-radius: 5px; overflow: auto; max-height: 460px; background: #3c2e22; }
.board-canvas { position: relative; width: 1200px; height: 700px; background-image: radial-gradient(circle, rgba(0,0,0,0.18) 1px, transparent 1.3px); background-size: 14px 14px; }
.board-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.board-svg path { pointer-events: stroke; cursor: pointer; }
.pin-card { position: absolute; width: 160px; background: var(--parchment-card); border-radius: 2px; box-shadow: 3px 5px 10px rgba(0,0,0,0.45); color: var(--ink-dark); border-top: 4px solid var(--gold); font-size: 12px; }
.pin-card.pista { border-top-color: var(--thread-blue); }
.pin-card.suspeito { border-top-color: var(--ink-red); }
.card-handle { display:flex; align-items:center; justify-content:space-between; padding: 5px 6px 3px; cursor: grab; user-select:none; }
.card-handle:active { cursor: grabbing; }
.pin-dot { width:8px; height:8px; border-radius:50%; background: var(--gold); }
.pin-card.pista .pin-dot { background: var(--thread-blue); }
.pin-card.suspeito .pin-dot { background: var(--ink-red); }
.card-body { padding: 0 6px 6px; }
.card-title-in { width: 100%; border:none; background:transparent; font-family:'Cormorant Garamond', serif; font-weight:700; font-size:13px; color: var(--ink-dark); }
.card-notes-in { width: 100%; border:none; background:transparent; font-size:11px; min-height:32px; color: rgba(43,33,48,0.85); }

.entry-meta { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.report-output { white-space: pre-wrap; background: rgba(0,0,0,0.2); border: 1px solid rgba(182,138,78,0.3); border-radius: 5px; padding: 14px; font-size: 13px; line-height: 1.6; margin-top: 12px; }

.save-indicator { font-size: 11px; color: var(--gold); opacity: 0; transition: opacity .3s; font-style: italic; }
.save-indicator.show { opacity: 1; }
.empty-msg { text-align: center; color: var(--parchment-dim); font-style: italic; font-size: 13px; padding: 20px 0; }
select { background: rgba(237,226,208,0.06); border: 1px solid rgba(182,138,78,0.35); color: var(--parchment); font-family:'EB Garamond',serif; font-size: 14px; padding: 7px 10px; border-radius: 3px; width: 100%; }
</style>
</head>
<body>
<div id="login-root" style="display:none;"></div>
<div id="app" style="display:none;">
  <div class="hub-header">
    <p class="hub-eyebrow">O Avesso</p>
    <h1 class="hub-title">Hub da Campanha</h1>
    <button class="logout-btn" id="reset-preview-btn">limpar dados de teste</button>
  </div>
  <div class="tab-nav" id="tab-nav"></div>
  <div class="tab-content" id="tab-content"></div>
</div>

<script>
// ---- MODO PRÉ-VISUALIZAÇÃO ----
// Sem Supabase, sem login: os dados ficam só no localStorage deste navegador,
// só pra você revisar o visual das abas antes de ligar o banco de verdade.
const db = {
  async get(key, shared = false) {
    const raw = localStorage.getItem('preview:' + (shared ? 'shared:' : 'local:') + key);
    return raw ? JSON.parse(raw) : null;
  },
  async set(key, value, shared = false) {
    localStorage.setItem('preview:' + (shared ? 'shared:' : 'local:') + key, JSON.stringify(value));
    return true;
  }
};

const TABS = [
  { id: 'diario', label: '📰 Diário' },
  { id: 'ficha', label: '🪡 Ficha' },
  { id: 'quadro', label: '🧵 Quadro de Linhas' },
  { id: 'npcs', label: '🎭 Gerador de NPCs' },
  { id: 'mestre', label: '📓 Caderno do Mestre' },
  { id: 'relatorio', label: '📜 Relatório' }
];

let activeTab = 'diario';

function renderNav() {
  const nav = document.getElementById('tab-nav');
  nav.innerHTML = TABS.map(t => `<button class="tab-btn ${t.id === activeTab ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('');
  nav.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.getAttribute('data-tab')));
  });
}

function switchTab(id) {
  activeTab = id;
  renderNav();
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + id);
  if (panel) panel.classList.add('active');
  loaders[id] && loaders[id]();
}

function escapeAttr(str) { return String(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escapeHtml(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function flashSave(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('show');
  el.textContent = 'salvo ✓';
  setTimeout(() => el.classList.remove('show'), 1400);
}
function flashError(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('show');
  el.textContent = 'erro ao salvar';
}

/* ---------- DIÁRIO (compartilhado) ---------- */
let diarioEntries = [];
let diarioLoaded = false;
let diarioSaveT = null;

async function loadDiario() {
  if (diarioLoaded) return renderDiario();
  const content = document.getElementById('tab-content');
  const val = await db.get('diario-entries', true);
  diarioEntries = (val && val.entries) || [];
  diarioLoaded = true;
  renderDiario();
}

function saveDiario() {
  clearTimeout(diarioSaveT);
  diarioSaveT = setTimeout(async () => {
    try { await db.set('diario-entries', { entries: diarioEntries }, true); flashSave('diario-save'); }
    catch (e) { flashError('diario-save'); }
  }, 500);
}

function renderDiario() {
  const panel = document.getElementById('panel-diario');
  panel.innerHTML = `
    <p class="section-title">Diário do Avesso</p>
    <p class="section-sub">Compartilhado — qualquer jogador com o app vê e edita.</p>
    <div class="center" style="margin-bottom:14px;"><button class="btn" id="diario-add">+ Nova Página</button></div>
    <div id="diario-list"></div>
    <p class="center save-indicator" id="diario-save">salvo ✓</p>
  `;
  document.getElementById('diario-add').addEventListener('click', () => {
    const nextNum = diarioEntries.length ? Math.max(...diarioEntries.map(e => parseInt(e.numero,10)||0)) + 1 : 1;
    diarioEntries.unshift({ id: Date.now(), numero: String(nextNum), data: '', titulo: '', presentes: '', resumo: '' });
    renderDiario(); saveDiario();
  });
  renderDiarioList();
}

function renderDiarioList() {
  const wrap = document.getElementById('diario-list');
  if (!diarioEntries.length) { wrap.innerHTML = '<p class="empty-msg">nenhuma página ainda</p>'; return; }
  wrap.innerHTML = diarioEntries.map(e => `
    <div class="card">
      <button class="remove-x" data-rm="${e.id}">✕</button>
      <div class="row-2" style="margin-bottom:8px;">
        <div class="field"><label>Título</label><input type="text" data-f="titulo" data-id="${e.id}" value="${escapeAttr(e.titulo)}" placeholder="ex: O Caso do Duque Desfiado"></div>
        <div class="field small"><label>Nº</label><input type="text" data-f="numero" data-id="${e.id}" value="${escapeAttr(e.numero)}"></div>
      </div>
      <div class="field"><label>Data</label><input type="text" data-f="data" data-id="${e.id}" value="${escapeAttr(e.data)}" placeholder="ex: 12/08"></div>
      <div class="field"><label>O que aconteceu</label><textarea data-f="resumo" data-id="${e.id}" style="min-height:70px;">${escapeHtml(e.resumo)}</textarea></div>
      <div class="field"><label>Presentes</label><input type="text" data-f="presentes" data-id="${e.id}" value="${escapeAttr(e.presentes)}" placeholder="nomes separados por vírgula"></div>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-f]').forEach(el => {
    el.addEventListener('input', ev => {
      const id = parseInt(el.getAttribute('data-id'),10);
      const f = el.getAttribute('data-f');
      const entry = diarioEntries.find(x => x.id === id);
      if (entry) { entry[f] = ev.target.value; saveDiario(); }
    });
  });
  wrap.querySelectorAll('[data-rm]').forEach(btn => {
    btn.addEventListener('click', () => {
      diarioEntries = diarioEntries.filter(x => x.id !== parseInt(btn.getAttribute('data-rm'),10));
      renderDiario(); saveDiario();
    });
  });
}

/* ---------- FICHA (pessoal) ---------- */
let fichaState = null;
let fichaSaveT = null;
const fichaDefault = {
  nome:'', sessao:'1', agulha:'2', dedal:'2', linha:'2', logica:5,
  kit:{lupa:false,monoculo:false,escala:false,dialetica:false},
  verdades:[{feito:false,texto:''},{feito:false,texto:''},{feito:false,texto:''}]
};

async function loadFicha() {
  if (fichaState) return renderFicha();
  const val = await db.get('ficha-personagem', false);
  fichaState = Object.assign({}, fichaDefault, val || {});
  fichaState.kit = Object.assign({}, fichaDefault.kit, fichaState.kit||{});
  if (!Array.isArray(fichaState.verdades) || fichaState.verdades.length!==3) fichaState.verdades = fichaDefault.verdades;
  renderFicha();
}
function saveFicha() {
  clearTimeout(fichaSaveT);
  fichaSaveT = setTimeout(async () => {
    try { await db.set('ficha-personagem', fichaState, false); flashSave('ficha-save'); }
    catch(e){ flashError('ficha-save'); }
  }, 500);
}
function renderFicha() {
  const panel = document.getElementById('panel-ficha');
  const kitNames = { lupa:['🔍','Lupa de Pedra Furada'], monoculo:['⏳','Monóculo do Tempo'], escala:['🪞','Mudança de Escala'], dialetica:['🎭','Dialética do Absurdo'] };
  panel.innerHTML = `
    <p class="section-title">Ficha da Visitante</p>
    <div class="card">
      <div class="row-2">
        <div class="field"><label>Nome</label><input type="text" id="fi-nome" value="${escapeAttr(fichaState.nome)}"></div>
        <div class="field small"><label>Sessão</label><input type="text" id="fi-sessao" value="${escapeAttr(fichaState.sessao)}"></div>
      </div>
    </div>
    <div class="attrs">
      <div class="attr-card"><div>🪡</div><p class="attr-name">Agulha</p><input class="attr-input" id="fi-agulha" value="${escapeAttr(fichaState.agulha)}"></div>
      <div class="attr-card"><div>🧵</div><p class="attr-name">Dedal</p><input class="attr-input" id="fi-dedal" value="${escapeAttr(fichaState.dedal)}"></div>
      <div class="attr-card"><div>🧶</div><p class="attr-name">Linha</p><input class="attr-input" id="fi-linha" value="${escapeAttr(fichaState.linha)}"></div>
    </div>
    <div class="card center">
      <p style="margin:0 0 8px;">Linha da Lógica: <strong>${fichaState.logica}</strong>/5</p>
      <div class="spools">${[0,1,2,3,4].map(i=>`<div class="spool ${i<fichaState.logica?'filled':''}" data-idx="${i}">${i<fichaState.logica?'●':'○'}</div>`).join('')}</div>
    </div>
    <div class="card">
      <p class="npc-label" style="margin-bottom:8px;">Kit de Detetive</p>
      ${Object.keys(kitNames).map(k=>`<label class="kit-item"><input type="checkbox" data-kit="${k}" ${fichaState.kit[k]?'checked':''}><span>${kitNames[k][0]} ${kitNames[k][1]}</span></label>`).join('')}
    </div>
    <div class="card">
      <p class="npc-label" style="margin-bottom:8px;">Verdades Esquecidas</p>
      ${[0,1,2].map(i=>`
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;">
          <input type="checkbox" data-vcheck="${i}" ${fichaState.verdades[i].feito?'checked':''}>
          <input type="text" data-vtext="${i}" value="${escapeAttr(fichaState.verdades[i].texto)}" placeholder="${['Primeira','Segunda','Terceira'][i]} verdade...">
        </div>
      `).join('')}
    </div>
    <p class="center save-indicator" id="ficha-save">salvo ✓</p>
  `;
  document.getElementById('fi-nome').addEventListener('input', e=>{fichaState.nome=e.target.value; saveFicha();});
  document.getElementById('fi-sessao').addEventListener('input', e=>{fichaState.sessao=e.target.value; saveFicha();});
  ['agulha','dedal','linha'].forEach(a=>{
    document.getElementById('fi-'+a).addEventListener('input', e=>{fichaState[a]=e.target.value; saveFicha();});
  });
  panel.querySelectorAll('.spool').forEach(s=>{
    s.addEventListener('click', ()=>{
      const idx = parseInt(s.getAttribute('data-idx'),10);
      fichaState.logica = (idx+1===fichaState.logica) ? idx : idx+1;
      renderFicha(); saveFicha();
    });
  });
  panel.querySelectorAll('[data-kit]').forEach(cb=>{
    cb.addEventListener('change', e=>{ fichaState.kit[cb.getAttribute('data-kit')]=e.target.checked; saveFicha(); });
  });
  [0,1,2].forEach(i=>{
    panel.querySelector(`[data-vcheck="${i}"]`).addEventListener('change', e=>{ fichaState.verdades[i].feito=e.target.checked; saveFicha(); });
    panel.querySelector(`[data-vtext="${i}"]`).addEventListener('input', e=>{ fichaState.verdades[i].texto=e.target.value; saveFicha(); });
  });
}

/* ---------- QUADRO DE LINHAS (pessoal/tela do mestre) ---------- */
let quadroState = null;
let quadroSaveT = null;
let connectMode = false, pendingSelect = null, dragging = null;
const CARD_W=160, CANVAS_W=1200, CANVAS_H=700;
const quadroDefault = { cards: [
  {id:1,tipo:'pista',titulo:'Fio azul na janela',notas:'',x:30,y:30},
  {id:2,tipo:'pista',titulo:'Resíduo de giz na emenda',notas:'',x:220,y:30},
  {id:3,tipo:'pista',titulo:'Eco na parede',notas:'',x:410,y:30},
  {id:4,tipo:'pista',titulo:'Bilhete da escrivaninha',notas:'',x:600,y:30},
  {id:5,tipo:'suspeito',titulo:'Duque Desfiado',notas:'',x:30,y:200},
  {id:6,tipo:'suspeito',titulo:'Criada de Pano',notas:'',x:220,y:200},
  {id:7,tipo:'suspeito',titulo:'Guarda de Botões',notas:'',x:410,y:200},
  {id:8,tipo:'suspeito',titulo:'Senhora Retrós',notas:'',x:600,y:200}
], connections: [] };
let quadroIdCounter = 9;

async function loadQuadro() {
  if (quadroState) return renderQuadro();
  const val = await db.get('quadro-linhas', false);
  quadroState = val || JSON.parse(JSON.stringify(quadroDefault));
  if (!Array.isArray(quadroState.cards)) quadroState.cards = [];
  if (!Array.isArray(quadroState.connections)) quadroState.connections = [];
  quadroState.cards.forEach(c=>{ if(c.id>=quadroIdCounter) quadroIdCounter=c.id+1; });
  renderQuadro();
}
function saveQuadro() {
  clearTimeout(quadroSaveT);
  quadroSaveT = setTimeout(async ()=>{
    try { await db.set('quadro-linhas', quadroState, false); flashSave('quadro-save'); }
    catch(e){ flashError('quadro-save'); }
  }, 500);
}
function anchorOf(c){ return { x: c.x + CARD_W/2, y: c.y + 14 }; }

function renderQuadro() {
  const panel = document.getElementById('panel-quadro');
  panel.innerHTML = `
    <p class="section-title">Quadro de Linhas</p>
    <p class="section-sub">arraste pela alça · ative conectar e clique em 2 cartões · clique num fio pra cortar</p>
    <div class="btn-row center" style="justify-content:center; flex-wrap:wrap;">
      <button class="btn ghost" id="q-add-pista">+ Pista</button>
      <button class="btn ghost" id="q-add-suspeito">+ Suspeito</button>
      <button class="btn ${connectMode?'':'ghost'}" id="q-connect">${connectMode?'● conectando':'Conectar'}</button>
    </div>
    <div class="board-scroll" style="margin-top:12px;">
      <div class="board-canvas" id="q-canvas">
        <svg class="board-svg" id="q-svg"></svg>
        <div id="q-cards"></div>
      </div>
    </div>
    <p class="center save-indicator" id="quadro-save">salvo ✓</p>
  `;
  document.getElementById('q-add-pista').addEventListener('click', ()=>addQuadroCard('pista'));
  document.getElementById('q-add-suspeito').addEventListener('click', ()=>addQuadroCard('suspeito'));
  document.getElementById('q-connect').addEventListener('click', ()=>{ connectMode=!connectMode; pendingSelect=null; renderQuadro(); });
  renderQuadroCards();
  drawQuadroConnections();
}
function addQuadroCard(tipo) {
  const n = quadroState.cards.length;
  quadroState.cards.push({ id: quadroIdCounter++, tipo, titulo: tipo==='pista'?'Nova pista':'Novo suspeito', notas:'', x: 30+(n%5)*50, y: 30+Math.floor(n/5)*40 });
  renderQuadro(); saveQuadro();
}
function renderQuadroCards() {
  const layer = document.getElementById('q-cards');
  layer.innerHTML = quadroState.cards.map(c => `
    <div class="pin-card ${c.tipo} ${pendingSelect===c.id?'active':''}" data-card="${c.id}" style="left:${c.x}px;top:${c.y}px;">
      <div class="card-handle" data-handle="${c.id}">
        <span class="pin-dot"></span>
        <button class="remove-x" style="position:static;font-size:11px;" data-rmcard="${c.id}">✕</button>
      </div>
      <div class="card-body">
        <input class="card-title-in" data-title="${c.id}" value="${escapeAttr(c.titulo)}">
        <textarea class="card-notes-in" data-notes="${c.id}">${escapeHtml(c.notas)}</textarea>
      </div>
    </div>
  `).join('');
  layer.querySelectorAll('[data-title]').forEach(el=>{
    el.addEventListener('input', e=>{ const c=quadroState.cards.find(x=>x.id===parseInt(el.getAttribute('data-title'),10)); if(c){c.titulo=e.target.value; saveQuadro();} });
  });
  layer.querySelectorAll('[data-notes]').forEach(el=>{
    el.addEventListener('input', e=>{ const c=quadroState.cards.find(x=>x.id===parseInt(el.getAttribute('data-notes'),10)); if(c){c.notas=e.target.value; saveQuadro();} });
  });
  layer.querySelectorAll('[data-rmcard]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = parseInt(btn.getAttribute('data-rmcard'),10);
      quadroState.cards = quadroState.cards.filter(c=>c.id!==id);
      quadroState.connections = quadroState.connections.filter(cn=>cn[0]!==id && cn[1]!==id);
      renderQuadro(); saveQuadro();
    });
  });
  layer.querySelectorAll('[data-handle]').forEach(h=>{
    const id = parseInt(h.getAttribute('data-handle'),10);
    if (connectMode) {
      h.addEventListener('click', ()=>{
        if (pendingSelect===null) { pendingSelect=id; renderQuadroCards(); }
        else if (pendingSelect===id) { pendingSelect=null; renderQuadroCards(); }
        else {
          const exists = quadroState.connections.findIndex(c=>(c[0]===pendingSelect&&c[1]===id)||(c[0]===id&&c[1]===pendingSelect));
          if (exists>=0) quadroState.connections.splice(exists,1); else quadroState.connections.push([pendingSelect,id]);
          pendingSelect=null; renderQuadroCards(); drawQuadroConnections(); saveQuadro();
        }
      });
    } else {
      h.addEventListener('pointerdown', e=>startQuadroDrag(e,id));
    }
  });
}
function startQuadroDrag(e,id) {
  const c = quadroState.cards.find(x=>x.id===id); if(!c) return;
  const rect = document.getElementById('q-canvas').getBoundingClientRect();
  dragging = { id, offsetX: e.clientX-rect.left-c.x, offsetY: e.clientY-rect.top-c.y };
  document.addEventListener('pointermove', onQuadroDrag);
  document.addEventListener('pointerup', endQuadroDrag);
}
function onQuadroDrag(e) {
  if (!dragging) return;
  const rect = document.getElementById('q-canvas').getBoundingClientRect();
  const c = quadroState.cards.find(x=>x.id===dragging.id); if(!c) return;
  let nx = Math.max(0, Math.min(CANVAS_W-CARD_W, e.clientX-rect.left-dragging.offsetX));
  let ny = Math.max(0, Math.min(CANVAS_H-40, e.clientY-rect.top-dragging.offsetY));
  c.x=nx; c.y=ny;
  const el = document.querySelector(`[data-card="${c.id}"]`);
  if (el) { el.style.left=nx+'px'; el.style.top=ny+'px'; }
  drawQuadroConnections();
}
function endQuadroDrag() {
  document.removeEventListener('pointermove', onQuadroDrag);
  document.removeEventListener('pointerup', endQuadroDrag);
  if (dragging) saveQuadro();
  dragging = null;
}
function drawQuadroConnections() {
  const svg = document.getElementById('q-svg'); if(!svg) return;
  svg.innerHTML = quadroState.connections.map(cn=>{
    const a = quadroState.cards.find(x=>x.id===cn[0]), b = quadroState.cards.find(x=>x.id===cn[1]);
    if(!a||!b) return '';
    const pA=anchorOf(a), pB=anchorOf(b);
    const mx=(pA.x+pB.x)/2, my=(pA.y+pB.y)/2+35;
    return `<path d="M ${pA.x},${pA.y} Q ${mx},${my} ${pB.x},${pB.y}" fill="none" stroke="#a5453f" stroke-width="2" opacity="0.75" data-a="${a.id}" data-b="${b.id}"/>`;
  }).join('');
  svg.querySelectorAll('path').forEach(p=>{
    p.addEventListener('click', ()=>{
      const a=parseInt(p.getAttribute('data-a'),10), b=parseInt(p.getAttribute('data-b'),10);
      quadroState.connections = quadroState.connections.filter(cn=>!((cn[0]===a&&cn[1]===b)||(cn[0]===b&&cn[1]===a)));
      drawQuadroConnections(); saveQuadro();
    });
  });
}

/* ---------- GERADOR DE NPCS (pessoal) ---------- */
const nomes = ['Senhor Alfinete','Dona Retalho','Mestre Verniz','Madame Costura','Seu Botão-de-Osso','Dona Renda','Senhor Fivela','Madame Percalina','Seu Fio-Solto','Dona Sarja','Senhor Colchete','Madame Tricô','Seu Chumaço','Dona Debrum','Senhor Passamane','Madame Organza'];
const tracos = ['fala sempre em rimas que nunca terminam','tem um olho de vidro que gira sozinho quando mente','cheira permanentemente a naftalina e cravo','nunca pisca, e isso incomoda todo mundo','carrega um novelo que nunca parece acabar','tem os dedos manchados de tinta azul, sempre','fala com a voz de outra pessoa quando fica nervoso','guarda todas as agulhas que já usou, numeradas','deixa cair um botão no chão toda vez que mente','anda sempre um passo atrasado do próprio corpo'];
const segredos = ['deve um favor que nunca conseguiu pagar','sabe onde fica uma emenda que ninguém mais lembra','já trocou de lugar com o próprio reflexo, uma vez','guarda uma verdade que não sabe o que fazer com ela','foi quem trancou uma porta importante, por engano','tem medo mortal de tesouras, por um motivo que não conta','viu a Visitante chegar, mas fingiu que não','sabe costurar de volta o que foi rasgado, mas cobra um preço estranho'];
let npcSaved = [], npcCurrent = null, npcLoaded=false, npcSaveT=null;

async function loadNpcs() {
  if (!npcLoaded) {
    const val = await db.get('gerador-npcs-salvos', false);
    npcSaved = (val && val.saved) || [];
    npcLoaded = true;
  }
  renderNpcs();
}
function saveNpcs() {
  clearTimeout(npcSaveT);
  npcSaveT = setTimeout(async ()=>{
    try { await db.set('gerador-npcs-salvos', {saved:npcSaved}, false); flashSave('npc-save'); }
    catch(e){ flashError('npc-save'); }
  }, 400);
}
function pick(arr, excl) { let c; do { c = arr[Math.floor(Math.random()*arr.length)]; } while(arr.length>1 && c===excl); return c; }
function renderNpcs() {
  const panel = document.getElementById('panel-npcs');
  panel.innerHTML = `
    <p class="section-title">Gerador de NPCs</p>
    <div class="center"><button class="btn" id="npc-gerar">🎲 Gerar Personagem</button></div>
    <div id="npc-current"></div>

    <div id="npc-saved-list"></div>
    <p class="center save-indicator" id="npc-save">salvo ✓</p>
  `;
  document.getElementById('npc-gerar').addEventListener('click', ()=>{
    npcCurrent = { nome: pick(nomes, npcCurrent&&npcCurrent.nome), traco: pick(tracos, npcCurrent&&npcCurrent.traco), segredo: pick(segredos, npcCurrent&&npcCurrent.segredo) };
    renderNpcCurrent();
  });
  renderNpcCurrent();
  renderNpcSaved();
}
function renderNpcCurrent() {
  const wrap = document.getElementById('npc-current');
  if (!npcCurrent) { wrap.innerHTML=''; return; }
  wrap.innerHTML = `
    <div class="npc-card">
      <p class="npc-name-display">${escapeHtml(npcCurrent.nome)}</p>
      <p class="npc-label">Traço Marcante</p><p class="npc-value">${escapeHtml(npcCurrent.traco)}</p>
      <p class="npc-label">Segredo</p><p class="npc-value" style="margin-bottom:0;">${escapeHtml(npcCurrent.segredo)}</p>
      <div class="btn-row"><button class="btn ghost" id="npc-salvar">guardar</button></div>
    </div>
  `;
  document.getElementById('npc-salvar').addEventListener('click', ()=>{
    npcSaved.unshift(Object.assign({},npcCurrent)); saveNpcs(); renderNpcSaved();
  });
}
function renderNpcSaved() {
  const wrap = document.getElementById('npc-saved-list');
  if (!npcSaved.length) { wrap.innerHTML = '<p class="empty-msg">nenhum guardado ainda</p>'; return; }
  wrap.innerHTML = npcSaved.map((n,i)=>`
    <div class="card">
      <button class="remove-x" data-rmnpc="${i}">✕</button>
      <p style="font-family:'Cormorant Garamond',serif;font-weight:600;font-size:15px;margin:0 0 4px;">${escapeHtml(n.nome)}</p>
      <p style="font-size:12px;color:var(--parchment-dim);margin:2px 0;">${escapeHtml(n.traco)}</p>
      <p style="font-size:12px;color:var(--parchment-dim);margin:2px 0;">${escapeHtml(n.segredo)}</p>
    </div>
  `).join('');
  wrap.querySelectorAll('[data-rmnpc]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ npcSaved.splice(parseInt(btn.getAttribute('data-rmnpc'),10),1); saveNpcs(); renderNpcSaved(); });
  });
}

/* ---------- RELATÓRIO DE SESSÃO ---------- */
async function loadRelatorio() {
  const val = await db.get('diario-entries', true);
  const entries = (val && val.entries) || [];
  const panel = document.getElementById('panel-relatorio');
  panel.innerHTML = `
    <p class="section-title">Relatório de Sessão</p>
    <p class="section-sub">Gere um texto pronto pra mandar pros jogadores.</p>
    <div class="field"><label>Escolha a sessão</label>
      <select id="rel-select">
        <option value="">selecione...</option>
        ${entries.map((e,i)=>`<option value="${i}">${escapeAttr(e.numero||'?')} — ${escapeAttr(e.titulo||'sem título')}</option>`).join('')}
      </select>
    </div>
    <div class="center"><button class="btn" id="rel-gerar">Gerar Relatório</button></div>
    <div id="rel-output"></div>
  `;
  document.getElementById('rel-gerar').addEventListener('click', ()=>{
    const idx = document.getElementById('rel-select').value;
    const out = document.getElementById('rel-output');
    if (idx === '') { out.innerHTML = '<p class="empty-msg">escolha uma sessão do Diário primeiro</p>'; return; }
    const e = entries[parseInt(idx,10)];
    const texto = `📜 O AVESSO — Relatório da Sessão ${e.numero || '?'}\n${e.titulo || '(sem título)'}${e.data ? ' — ' + e.data : ''}\n\n${e.resumo || '(sem resumo registrado)'}\n\nPresentes: ${e.presentes || '(não registrado)'}`;
    out.innerHTML = `<div class="report-output" id="rel-text">${escapeHtml(texto)}</div><div class="center btn-row" style="justify-content:center;"><button class="btn ghost" id="rel-copy">copiar texto</button></div>`;
    document.getElementById('rel-copy').addEventListener('click', async ()=>{
      try { await navigator.clipboard.writeText(texto); const b=document.getElementById('rel-copy'); b.textContent='copiado ✓'; setTimeout(()=>b.textContent='copiar texto',1500); } catch(e) {}
    });
  });
}

const loaders = { diario: loadDiario, ficha: loadFicha, quadro: loadQuadro, npcs: loadNpcs, mestre: loadMestre, relatorio: loadRelatorio };

function buildPanels() {

  content.innerHTML = TABS.map(t => `<div class="tab-panel ${t.id===activeTab?'active':''}" id="panel-${t.id}"></div>`).join('');
